# Throwaway fork-only workflow reproducing apache/datafusion-comet#7240: the executor
# reflection probe for native Iceberg writes fails on Iceberg 1.12 because
# ManifestFiles.read(ManifestFile, FileIO) was removed. Not intended for upstream.
#
# Each matrix leg pins the Spark 4.1 profile's Iceberg runtime, runs IcebergReflectionSuite,
# and then checks that the outcome matches the expectation for that version, so a green leg
# means "behaved as expected" (1.11 passes, 1.12 fails with the exact issue message).

name: Repro 7240 (Iceberg 1.12 manifest read)

on:
  push:
    branches:
      - 'tlfua/ci/7240-*'
  workflow_dispatch:

permissions:
  contents: read

# Comet's spark *test* sources do not compile against Iceberg 1.12 (HadoopConfigurable.getConf became
# a default method; the vendored RESTCatalogAdapter uses REST APIs changed in 1.12), so instead of
# IcebergReflectionSuite this compiles only the main sources and calls the eligibility gate's entry
# point, IcebergReflection.executorReflectionUnresolved, directly. No native library is needed.
jobs:
  reflection-probe:
    name: executorReflectionUnresolved (Spark 4.1, Iceberg ${{ matrix.iceberg }})
    runs-on: ubuntu-24.04
    container:
      image: amd64/rust
    strategy:
      fail-fast: false
      matrix:
        include:
          - iceberg: 1.11.0
            expect: resolves
          - iceberg: 1.12.0
            expect: probe-fails
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-builder
        with:
          rust-version: stable
          jdk-version: 17

      - name: Pin Iceberg ${{ matrix.iceberg }} in the spark-4.1 profile (CI only)
        shell: bash
        run: |
          set -euo pipefail
          # The spark-4.1 profile is the only place spark/pom.xml pins 1.11.0.
          test "$(grep -c '<version>1.11.0</version>' spark/pom.xml)" = 1
          sed -i 's#<version>1.11.0</version>#<version>${{ matrix.iceberg }}</version>#' spark/pom.xml
          # git does not treat the container checkout as a repository, so show the result with grep.
          grep -n '<version>${{ matrix.iceberg }}</version>' spark/pom.xml

      - name: Compile main sources and write the test classpath
        shell: bash
        run: |
          set -euo pipefail
          MAVEN_OPTS="-Xmx4G -Xms2G" ./mvnw -B -Pspark-4.1 -Dmaven.test.skip=true \
            compile dependency:build-classpath -Dmdep.includeScope=test -Dmdep.outputFile=cp.txt \
            2>&1 | tee mvn.log
          test -s spark/cp.txt

      - name: List ManifestFiles.read overloads in the resolved runtime
        shell: bash
        run: |
          set -euo pipefail
          jar=$(tr ':' '\n' < spark/cp.txt | grep '/iceberg-spark-runtime-4.1_2.13/')
          echo "$jar" | tee javap.txt
          javap -cp "$jar" org.apache.iceberg.ManifestFiles | grep ' read(' | tee -a javap.txt

      - name: Call IcebergReflection.executorReflectionUnresolved
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p probe
          cat > probe/Probe.java <<'JAVA'
          public class Probe {
            public static void main(String[] args) {
              System.out.println("RESULT: "
                  + org.apache.comet.iceberg.IcebergReflection.executorReflectionUnresolved());
            }
          }
          JAVA
          cp="spark/target/classes:common/target/classes:$(cat spark/cp.txt)"
          javac -cp "$cp" -d probe probe/Probe.java
          java -cp "probe:$cp" Probe 2>&1 | tee probe.log

      - name: Check outcome (expect ${{ matrix.expect }})
        shell: bash
        run: |
          set -uo pipefail
          result=$(grep '^RESULT: ' probe.log)
          echo "$result"
          msg='Some(executor-side Iceberg reflection did not resolve: NoSuchMethodException: org.apache.iceberg.ManifestFiles.read(org.apache.iceberg.ManifestFile,org.apache.iceberg.io.FileIO))'
          case '${{ matrix.expect }}' in
            resolves)
              test "$result" = 'RESULT: None' || { echo "::error::expected the probe to resolve"; exit 1; }
              ;;
            probe-fails)
              test "$result" = "RESULT: $msg" || { echo "::error::probe result differs from the issue"; exit 1; }
              echo "Reproduced: $msg"
              ;;
          esac

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: logs-iceberg-${{ matrix.iceberg }}
          path: |
            mvn.log
            javap.txt
            probe.log
            spark/cp.txt
          if-no-files-found: ignore
          retention-days: 7
